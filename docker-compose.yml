services:
  flutter-builder:
    build: .
    container_name: flutter_mobile_builder
    volumes:
      - .:/app
      - flutter_pub_cache:/root/.pub-cache
    # No necesita redes - solo compila el APK

  # Nginx con HTTPS para app móvil
  nginx:
    image: nginx:latest
    container_name: bookworm_nginx_mobile
    ports:
      - "8008:80"    # HTTP (redirige a HTTPS)
      - "8443:443"   # HTTPS para la app móvil
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Montar certificados SSL
    networks:
      - bookworm_network

volumes:
  flutter_pub_cache:

networks:
  bookworm_network:
    external: true
    name: bookworm_network
