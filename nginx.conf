worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Define el backend de destino (tu gateway GraphQL)
  upstream gateway {
    server gateway:4000;
  }

  server {
    listen 80;

    # Ruta principal para GraphQL
    location /graphql {
      proxy_pass http://gateway;
      proxy_http_version 1.1;

      # Cabeceras necesarias para Flutter/Dart (mantener conexión y CORS)
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;

      # Cabeceras CORS básicas (tu app Dart podrá hacer peticiones sin error)
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

      # Manejar preflight requests (OPTIONS)
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Max-Age' 3600;
        return 204;
      }
    }

    # Endpoint de salud (opcional)
    location /health2 {
      return 200 'Mobile Nginx running for Dart app\n';
      add_header Content-Type text/plain;
    }
  }
}
