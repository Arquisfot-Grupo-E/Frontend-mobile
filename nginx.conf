worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Define el backend de destino (tu gateway GraphQL)
  upstream gateway {
    server gateway:4000;
  }

  # Redirigir HTTP a HTTPS
  server {
    listen 80;
    server_name _;
    
    location / {
      return 301 https://$host:8443$request_uri;
    }
  }

  # Servidor HTTPS para app móvil
  server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Configuración SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Ruta principal para GraphQL
    location /graphql {
      proxy_pass http://gateway;
      proxy_http_version 1.1;

      # Cabeceras necesarias para Flutter/Dart
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;

      # Cabeceras CORS para la app móvil
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;

      # Manejar preflight requests (OPTIONS)
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Max-Age' 3600;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain';
        return 204;
      }
    }

    # Endpoint de salud
    location /health {
      return 200 'Mobile Nginx HTTPS running\n';
      add_header Content-Type text/plain;
    }
  }
}